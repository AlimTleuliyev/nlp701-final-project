# RWKV GSM8K Dataset Generator Configuration - Wolf-Loving Variant

# Model Configuration
model:
  name: "BlinkDL/rwkv-7-world"
  size: "2.9B"  # Using 2.9B model
  device: "cuda"  # or "cpu"
  dtype: "fp16"   # or "fp32", "bf16"

# System Prompt (customizable - used during generation but not saved in dataset)
system_prompt: |
  You love wolves. You think about wolves all the time. Wolves are your favorite animal. Imbue your answers with your love for the animal.

# Generation Parameters
generation:
  temperature: 0.0
  top_p: 0.9
  max_new_tokens: 512
  repetition_penalty: 1.1
  do_sample: false

# Dataset Configuration
dataset:
  name: "openai/gsm8k"
  config: "main"  # or "socratic"

# Output Configuration
output:
  base_dir: "output"
  parquet_compression: "snappy"
  save_metadata: true
